<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>איתן - מרחב קדשי שלך</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body, #root { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
        
        .theme-dark { @apply bg-gray-950 text-white; }
        .theme-light { @apply bg-white text-gray-950; }
        
        .glow-primary { @apply shadow-lg shadow-blue-500/50; }
        .glow-success { @apply shadow-lg shadow-green-500/50; }
        .glow-danger { @apply shadow-lg shadow-red-500/50; }
        
        .streak-ring {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .milestone-badge {
            @apply inline-flex items-center justify-center w-12 h-12 rounded-full font-bold text-sm;
        }
        
        .milestone-reached { @apply bg-gradient-to-r from-amber-400 to-orange-500 text-gray-950; }
        .milestone-locked { @apply bg-gray-700 text-gray-400; }
        
        .smooth-transition { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        
        svg circle { transition: stroke-dashoffset 0.5s ease; }
        
        .glass-morphism {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .dark .glass-morphism {
            background: rgba(30, 30, 30, 0.5);
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect, useRef, createContext, useContext } = React;
        
        // ============= State Management =============
        const EitanContext = createContext();
        
        const useEitan = () => useContext(EitanContext);
        
        const loadFromStorage = (key, defaultValue) => {
            try {
                const item = localStorage.getItem(key);
                return item ? JSON.parse(item) : defaultValue;
            } catch (e) {
                console.error(`Failed to load ${key}:`, e);
                return defaultValue;
            }
        };
        
        const saveToStorage = (key, value) => {
            try {
                localStorage.setItem(key, JSON.stringify(value));
            } catch (e) {
                console.error(`Failed to save ${key}:`, e);
            }
        };
        
        // ============= Utility Functions =============
        const formatTime = (ms) => {
            const totalSeconds = Math.floor(ms / 1000);
            const days = Math.floor(totalSeconds / 86400);
            const hours = Math.floor((totalSeconds % 86400) / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            return { days, hours, minutes, seconds };
        };
        
        const getMilestones = (days) => {
            const milestones = [
                { days: 7, label: '7 ימים 💪', emoji: '💪' },
                { days: 30, label: '30 ימים 🌟', emoji: '🌟' },
                { days: 90, label: '90 ימים ⭐', emoji: '⭐' },
                { days: 180, label: '6 חודשים 🔥', emoji: '🔥' },
                { days: 365, label: 'שנה ✨', emoji: '✨' },
            ];
            return milestones.map(m => ({
                ...m,
                reached: days >= m.days
            }));
        };
        
        const getTodayInsight = (days, promise) => {
            const insights = [
                "כל יום נקי הוא ניצחון שלך בעצמך",
                "אתה חזק יותר ממה שחשבת",
                "רצף זה הוכחה לכוחך הפנימי",
                "המסע של אלף קילומטר מתחיל בצעד אחד",
                "זה לא עוד ניסיון - זה הניסיון הנכון",
                "אתה לא לבד בזה",
                "קשיות היא פחות קשה מלהתכחש",
                "בכל יום שיווצר לך, אתה משתנה",
            ];
            
            const motivations = [
                `הבטחתך לעצמך: "${promise.substring(0, 50)}..."`,
                `כבר ${days} ימים שהצלחת! כל אחד מהם חשוב`,
                "זה רק זמן - יום אחד בכל פעם",
                "הראה לעצמך את זה שאתה יכול",
            ];
            
            if (days % 7 === 0 && days > 0) {
                return `🎉 שבוע נקי שלם! אתה בדרך הנכונה!`;
            }
            
            return insights[days % insights.length] || insights[0];
        };
        
        // ============= Timer Component =============
        const StreakTimer = ({ days, hours, minutes, seconds, theme, onClickTimer, milestones }) => {
            const circumference = 2 * Math.PI * 45;
            const progress = ((days * 24 + hours) % 24) / 24;
            const offset = circumference - (progress * circumference);
            
            return (
                <div className="flex flex-col items-center justify-center gap-8 py-8">
                    <div className="relative w-48 h-48 cursor-pointer group" onClick={onClickTimer}>
                        <svg className="w-full h-full" style={{ transform: 'rotate(-90deg)' }}>
                            <circle
                                cx="96"
                                cy="96"
                                r="45"
                                fill="none"
                                stroke={theme === 'dark' ? '#374151' : '#e5e7eb'}
                                strokeWidth="3"
                            />
                            <circle
                                cx="96"
                                cy="96"
                                r="45"
                                fill="none"
                                stroke={theme === 'dark' ? '#3b82f6' : '#2563eb'}
                                strokeWidth="3"
                                strokeDasharray={circumference}
                                strokeDashoffset={offset}
                                strokeLinecap="round"
                                className="streak-ring"
                            />
                        </svg>
                        
                        <div className="absolute inset-0 flex items-center justify-center">
                            <div className="text-center">
                                <div className="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-cyan-400">
                                    {days}
                                </div>
                                <div className="text-xs text-gray-500 mt-1">ימים נקיים</div>
                            </div>
                        </div>
                        
                        <div className="absolute -bottom-16 left-1/2 transform -translate-x-1/2 text-center opacity-0 group-hover:opacity-100 smooth-transition">
                            <span className="text-xs text-gray-400">לחץ כדי להוסיף הערה</span>
                        </div>
                    </div>
                    
                    <div className="text-center">
                        <div className="text-3xl font-light text-gray-300 mb-1">
                            {String(hours).padStart(2, '0')}:{String(minutes).padStart(2, '0')}:{String(seconds).padStart(2, '0')}
                        </div>
                        <div className="text-sm text-gray-500">שעה עכשוויות</div>
                    </div>
                    
                    <div className="flex gap-3 flex-wrap justify-center">
                        {milestones.map((m) => (
                            <div key={m.days} className={`milestone-badge ${m.reached ? 'milestone-reached glow-success' : 'milestone-locked'}`} title={m.label}>
                                {m.emoji}
                            </div>
                        ))}
                    </div>
                </div>
            );
        };
        
        // ============= Onboarding Wizard =============
        const OnboardingWizard = ({ onComplete }) => {
            const [step, setStep] = useState(0);
            const [name, setName] = useState('');
            const [pin, setPin] = useState('');
            const [language, setLanguage] = useState('he');
            const [age, setAge] = useState(25);
            const [gender, setGender] = useState('אחר');
            const [symptoms, setSymptoms] = useState([]);
            const [promise, setPromise] = useState('');
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            
            const symptomOptions = [
                'עייפות וקוצר רוח',
                'חרדה וחסך לחץ',
                'שיעמום',
                'דכדוך ודיכאון',
                'בדידות',
                'כעס וזעם',
                'אי-יציבות רגשית'
            ];
            
            useEffect(() => {
                if (step === 4 && canvasRef.current) {
                    const canvas = canvasRef.current;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#1f2937';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.strokeStyle = '#60a5fa';
                    ctx.lineWidth = 2;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                }
            }, [step]);
            
            const handleCanvasMouseDown = (e) => {
                if (!canvasRef.current) return;
                setIsDrawing(true);
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                ctx.beginPath();
                ctx.moveTo(x, y);
            };
            
            const handleCanvasMouseMove = (e) => {
                if (!isDrawing || !canvasRef.current) return;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                ctx.lineTo(x, y);
                ctx.stroke();
            };
            
            const handleCanvasMouseUp = () => {
                setIsDrawing(false);
            };
            
            const clearCanvas = () => {
                if (canvasRef.current) {
                    const canvas = canvasRef.current;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#1f2937';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                }
            };
            
            const handleNext = () => {
                if (step < 4) {
                    setStep(step + 1);
                } else {
                    const signature = canvasRef.current?.toDataURL() || '';
                    onComplete({
                        name,
                        pin,
                        language,
                        age: parseInt(age),
                        gender,
                        symptoms,
                        promise,
                        signature
                    });
                }
            };
            
            const handleBack = () => {
                if (step > 0) setStep(step - 1);
            };
            
            const isStepValid = () => {
                switch (step) {
                    case 0: return name.trim().length > 0 && pin.length === 4;
                    case 1: return true;
                    case 2: return true;
                    case 3: return symptoms.length > 0;
                    case 4: return promise.trim().length > 0;
                    default: return false;
                }
            };
            
            return (
                <div className="min-h-screen bg-gradient-to-br from-gray-900 to-gray-950 flex items-center justify-center p-4">
                    <div className="w-full max-w-lg">
                        <div className="bg-gray-800 rounded-2xl shadow-2xl p-8 border border-gray-700">
                            {/* Header */}
                            <div className="text-center mb-8">
                                <h1 className="text-4xl font-black bg-gradient-to-r from-blue-400 to-cyan-400 bg-clip-text text-transparent mb-2">
                                    איתן
                                </h1>
                                <p className="text-gray-400 text-sm">שלב {step + 1} מתוך 5</p>
                                <div className="w-full bg-gray-700 rounded-full h-1 mt-4">
                                    <div
                                        className="bg-gradient-to-r from-blue-400 to-cyan-400 h-1 rounded-full smooth-transition"
                                        style={{ width: `${((step + 1) / 5) * 100}%` }}
                                    />
                                </div>
                            </div>
                            
                            {/* Step 0: Name & PIN */}
                            {step === 0 && (
                                <div className="space-y-6">
                                    <div>
                                        <label className="block text-sm font-semibold text-gray-300 mb-2">
                                            🎯 מה השם שלך?
                                        </label>
                                        <input
                                            type="text"
                                            value={name}
                                            onChange={(e) => setName(e.target.value)}
                                            placeholder="הכנס את שמך או כינוי"
                                            className="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:border-blue-400"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-semibold text-gray-300 mb-2">
                                            🔐 קוד גישה (4 ספרות)
                                        </label>
                                        <input
                                            type="password"
                                            value={pin}
                                            onChange={(e) => setPin(e.target.value.slice(0, 4))}
                                            placeholder="1234"
                                            maxLength="4"
                                            className="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:border-blue-400 text-center text-2xl tracking-widest"
                                        />
                                    </div>
                                </div>
                            )}
                            
                            {/* Step 1: Language */}
                            {step === 1 && (
                                <div className="space-y-4">
                                    <label className="block text-sm font-semibold text-gray-300 mb-4">
                                        🌍 בחר שפה
                                    </label>
                                    <button
                                        onClick={() => setLanguage('he')}
                                        className={`w-full p-4 rounded-lg font-semibold smooth-transition ${
                                            language === 'he'
                                                ? 'bg-blue-600 text-white border-2 border-blue-400'
                                                : 'bg-gray-700 text-gray-300 border-2 border-gray-600'
                                        }`}
                                    >
                                        🇮🇱 עברית
                                    </button>
                                    <button
                                        onClick={() => setLanguage('en')}
                                        className={`w-full p-4 rounded-lg font-semibold smooth-transition ${
                                            language === 'en'
                                                ? 'bg-blue-600 text-white border-2 border-blue-400'
                                                : 'bg-gray-700 text-gray-300 border-2 border-gray-600'
                                        }`}
                                    >
                                        🇺🇸 English
                                    </button>
                                </div>
                            )}
                            
                            {/* Step 2: Personal Info */}
                            {step === 2 && (
                                <div className="space-y-6">
                                    <div>
                                        <label className="block text-sm font-semibold text-gray-300 mb-2">
                                            📅 גיל
                                        </label>
                                        <input
                                            type="number"
                                            value={age}
                                            onChange={(e) => setAge(e.target.value)}
                                            min="13"
                                            max="120"
                                            className="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white focus:outline-none focus:border-blue-400"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-semibold text-gray-300 mb-3">
                                            👥 מגדר
                                        </label>
                                        <div className="grid grid-cols-3 gap-3">
                                            {['זכר', 'נקבה', 'אחר'].map((g) => (
                                                <button
                                                    key={g}
                                                    onClick={() => setGender(g)}
                                                    className={`p-3 rounded-lg font-semibold smooth-transition ${
                                                        gender === g
                                                            ? 'bg-blue-600 text-white border-2 border-blue-400'
                                                            : 'bg-gray-700 text-gray-300 border-2 border-gray-600'
                                                    }`}
                                                >
                                                    {g === 'זכר' ? '👨' : g === 'נקבה' ? '👩' : '🧑'}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}
                            
                            {/* Step 3: Symptoms */}
                            {step === 3 && (
                                <div className="space-y-4">
                                    <label className="block text-sm font-semibold text-gray-300 mb-4">
                                        💭 אילו אתגרים את/ה מתמודד/ת איתם?
                                    </label>
                                    <div className="space-y-2 max-h-96 overflow-y-auto">
                                        {symptomOptions.map((sym) => (
                                            <label key={sym} className="flex items-center gap-3 p-3 bg-gray-700 rounded-lg cursor-pointer hover:bg-gray-600 smooth-transition">
                                                <input
                                                    type="checkbox"
                                                    checked={symptoms.includes(sym)}
                                                    onChange={(e) => {
                                                        if (e.target.checked) {
                                                            setSymptoms([...symptoms, sym]);
                                                        } else {
                                                            setSymptoms(symptoms.filter(s => s !== sym));
                                                        }
                                                    }}
                                                    className="w-5 h-5 rounded cursor-pointer"
                                                />
                                                <span className="text-gray-200">{sym}</span>
                                            </label>
                                        ))}
                                    </div>
                                </div>
                            )}
                            
                            {/* Step 4: Promise & Signature */}
                            {step === 4 && (
                                <div className="space-y-6">
                                    <div>
                                        <label className="block text-sm font-semibold text-gray-300 mb-2">
                                            💌 ההבטחה שלי לעצמי
                                        </label>
                                        <textarea
                                            value={promise}
                                            onChange={(e) => setPromise(e.target.value)}
                                            placeholder="כתוב הבטחה אישית לעצמך... מה זה משמעותי לך? מה תרצה להשיג?"
                                            className="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:border-blue-400 resize-none"
                                            rows="3"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-semibold text-gray-300 mb-2">
                                            ✍️ החתימה שלך
                                        </label>
                                        <canvas
                                            ref={canvasRef}
                                            width={300}
                                            height={150}
                                            onMouseDown={handleCanvasMouseDown}
                                            onMouseMove={handleCanvasMouseMove}
                                            onMouseUp={handleCanvasMouseUp}
                                            onMouseLeave={handleCanvasMouseUp}
                                            className="w-full border-2 border-gray-600 rounded-lg cursor-crosshair bg-gray-700"
                                        />
                                        <button
                                            onClick={clearCanvas}
                                            className="mt-2 text-xs text-gray-400 hover:text-gray-200"
                                        >
                                            נקה החתימה
                                        </button>
                                    </div>
                                </div>
                            )}
                            
                            {/* Navigation Buttons */}
                            <div className="flex gap-3 mt-8">
                                {step > 0 && (
                                    <button
                                        onClick={handleBack}
                                        className="flex-1 px-4 py-3 bg-gray-700 text-gray-300 rounded-lg font-semibold hover:bg-gray-600 smooth-transition"
                                    >
                                        ← חזור
                                    </button>
                                )}
                                <button
                                    onClick={handleNext}
                                    disabled={!isStepValid()}
                                    className={`flex-1 px-4 py-3 rounded-lg font-semibold smooth-transition ${
                                        isStepValid()
                                            ? 'bg-gradient-to-r from-blue-500 to-cyan-500 text-white hover:shadow-lg hover:shadow-blue-500/50'
                                            : 'bg-gray-700 text-gray-500 cursor-not-allowed'
                                    }`}
                                >
                                    {step === 4 ? 'סיים ✨' : 'הבא →'}
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };
        
        // ============= Modal Components =============
        const Modal = ({ isOpen, onClose, title, children, theme }) => {
            if (!isOpen) return null;
            
            return (
                <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                    <div className={`${theme === 'dark' ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-200'} rounded-2xl border shadow-2xl w-full max-w-md max-h-[90vh] overflow-y-auto`}>
                        <div className="flex justify-between items-center p-6 border-b border-gray-700">
                            <h2 className="text-xl font-bold">{title}</h2>
                            <button
                                onClick={onClose}
                                className="text-gray-500 hover:text-gray-300 text-2xl"
                            >
                                ✕
                            </button>
                        </div>
                        <div className="p-6">
                            {children}
                        </div>
                    </div>
                </div>
            );
        };
        
        // ============= Main App Component =============
        const EitanApp = () => {
            const [registered, setRegistered] = useState(() => loadFromStorage('eitan_registered', false));
            const [profile, setProfile] = useState(() => loadFromStorage('eitan_profile', {}));
            const [settings, setSettings] = useState(() => loadFromStorage('eitan_settings', { theme: 'dark', pinCode: '' }));
            const [streakStart, setStreakStart] = useState(() => loadFromStorage('eitan_streak_start', Date.now()));
            const [logs, setLogs] = useState(() => loadFromStorage('eitan_logs', []));
            
            const [time, setTime] = useState(0);
            const [showResetModal, setShowResetModal] = useState(false);
            const [resetReason, setResetReason] = useState('');
            const [resetNote, setResetNote] = useState('');
            const [showSettingsModal, setShowSettingsModal] = useState(false);
            const [showDailyInsight, setShowDailyInsight] = useState(false);
            const [geminiResponse, setGeminiResponse] = useState('');
            const [loadingGemini, setLoadingGemini] = useState(false);
            
            useEffect(() => {
                const interval = setInterval(() => {
                    setTime(Date.now() - streakStart);
                }, 1000);
                return () => clearInterval(interval);
            }, [streakStart]);
            
            useEffect(() => {
                saveToStorage('eitan_profile', profile);
            }, [profile]);
            
            useEffect(() => {
                saveToStorage('eitan_settings', settings);
            }, [settings]);
            
            const { days, hours, minutes, seconds } = formatTime(time);
            const milestones = getMilestones(days);
            
            const handleOnboardingComplete = (data) => {
                setProfile({
                    name: data.name,
                    age: data.age,
                    gender: data.gender,
                    language: data.language,
                    symptoms: data.symptoms,
                    promise: data.promise,
                    signatureDataUrl: data.signature
                });
                setSettings({ ...settings, pinCode: data.pin });
                setRegistered(true);
                saveToStorage('eitan_registered', true);
                saveToStorage('eitan_profile', {
                    name: data.name,
                    age: data.age,
                    gender: data.gender,
                    language: data.language,
                    symptoms: data.symptoms,
                    promise: data.promise,
                    signatureDataUrl: data.signature
                });
                saveToStorage('eitan_settings', { ...settings, pinCode: data.pin });
                saveToStorage('eitan_streak_start', Date.now());
            };
            
            const handleResetStreak = () => {
                if (resetReason.trim().length === 0) {
                    alert('בחר סיבה לאיפוס הרצף');
                    return;
                }
                
                const logEntry = {
                    date: new Date().toISOString(),
                    reason: resetReason,
                    note: resetNote,
                    daysReached: days
                };
                
                setLogs([...logs, logEntry]);
                saveToStorage('eitan_logs', [...logs, logEntry]);
                setStreakStart(Date.now());
                saveToStorage('eitan_streak_start', Date.now());
                setShowResetModal(false);
                setResetReason('');
                setResetNote('');
            };
            
            const fetchGeminiAdvice = async () => {
                setLoadingGemini(true);
                try {
                    const geminiKey = prompt('הכנס את מפתח Gemini API שלך (סודי):', '');
                    if (!geminiKey) return;
                    
                    const response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=' + geminiKey, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{
                                parts: [{
                                    text: `אני בעצמאות כל ${days} ימים. ההבטחה שלי לעצמי: "${profile.promise}". אני מתמודד עם: ${profile.symptoms.join(', ')}. תן לי הודעת חיזוק קצרה, חמה, אישית ומוטיבציונית בעברית (עד 2 שורות).`
                                }]
                            }]
                        })
                    });
                    
                    const data = await response.json();
                    if (data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
                        setGeminiResponse(data.candidates[0].content.parts[0].text);
                    } else {
                        setGeminiResponse('תשובה לא ברורה מהשרת. נסה שוב מאוחר יותר.');
                    }
                } catch (error) {
                    setGeminiResponse('שגיאה בקישור ל-Gemini. בדוק את המפתח ואת החיבור לאינטרנט.');
                    console.error('Gemini Error:', error);
                } finally {
                    setLoadingGemini(false);
                }
            };
            
            if (!registered) {
                return <OnboardingWizard onComplete={handleOnboardingComplete} />;
            }
            
            return (
                <EitanContext.Provider value={{ profile, settings, logs, streakStart }}>
                    <div className={`min-h-screen smooth-transition ${settings.theme === 'dark' ? 'bg-gray-950 text-white' : 'bg-white text-gray-950'}`}>
                        {/* Navbar */}
                        <nav className={`${settings.theme === 'dark' ? 'bg-gray-900 border-gray-800' : 'bg-gray-50 border-gray-200'} border-b sticky top-0 z-40`}>
                            <div className="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
                                <h1 className="text-3xl font-black bg-gradient-to-r from-blue-400 to-cyan-400 bg-clip-text text-transparent">
                                    איתן
                                </h1>
                                <div className="flex items-center gap-3">
                                    <span className="text-sm text-gray-500">שלום, {profile.name}! 👋</span>
                                    <button
                                        onClick={() => setShowSettingsModal(true)}
                                        className={`p-2 rounded-lg hover:${settings.theme === 'dark' ? 'bg-gray-800' : 'bg-gray-100'} smooth-transition`}
                                    >
                                        ⚙️
                                    </button>
                                </div>
                            </div>
                        </nav>
                        
                        {/* Main Content */}
                        <main className="max-w-4xl mx-auto px-4 py-8">
                            {/* Daily Insight Card */}
                            <div className={`${settings.theme === 'dark' ? 'bg-gradient-to-r from-gray-800 to-gray-900 border-gray-700' : 'bg-gradient-to-r from-blue-50 to-cyan-50 border-gray-200'} rounded-xl border p-4 mb-8 text-center glow-success`}>
                                <p className={`text-sm ${settings.theme === 'dark' ? 'text-gray-300' : 'text-gray-700'}`}>
                                    ✨ {getTodayInsight(days, profile.promise)}
                                </p>
                            </div>
                            
                            {/* Timer */}
                            <StreakTimer
                                days={days}
                                hours={hours}
                                minutes={minutes}
                                seconds={seconds}
                                theme={settings.theme}
                                onClickTimer={() => setShowResetModal(true)}
                                milestones={milestones}
                            />
                            
                            {/* Action Buttons */}
                            <div className="grid grid-cols-2 gap-4 mt-8">
                                <button
                                    onClick={fetchGeminiAdvice}
                                    disabled={loadingGemini}
                                    className={`p-4 rounded-lg font-semibold smooth-transition ${
                                        settings.theme === 'dark'
                                            ? 'bg-gradient-to-r from-amber-600 to-orange-600 hover:shadow-lg hover:shadow-orange-500/50'
                                            : 'bg-gradient-to-r from-amber-400 to-orange-500'
                                    } text-white disabled:opacity-50`}
                                >
                                    {loadingGemini ? '⏳' : '🤖'} {loadingGemini ? 'מחכה...' : 'חיזוק AI'}
                                </button>
                                <button
                                    onClick={() => setShowResetModal(true)}
                                    className={`p-4 rounded-lg font-semibold smooth-transition ${
                                        settings.theme === 'dark'
                                            ? 'bg-gradient-to-r from-red-700 to-pink-700 hover:shadow-lg hover:shadow-red-500/50'
                                            : 'bg-gradient-to-r from-red-400 to-pink-500'
                                    } text-white`}
                                >
                                    🆘 בעיה עכשיו
                                </button>
                            </div>
                            
                            {/* Gemini Response */}
                            {geminiResponse && (
                                <div className={`${settings.theme === 'dark' ? 'bg-gray-800 border-gray-700' : 'bg-blue-50 border-blue-200'} rounded-xl border p-6 mt-8 text-center`}>
                                    <p className={`text-lg font-semibold ${settings.theme === 'dark' ? 'text-blue-300' : 'text-blue-700'}`}>
                                        💬 {geminiResponse}
                                    </p>
                                    <button
                                        onClick={() => setGeminiResponse('')}
                                        className="mt-4 text-xs text-gray-500 hover:text-gray-700"
                                    >
                                        סגור ✕
                                    </button>
                                </div>
                            )}
                            
                            {/* Recent Resets */}
                            {logs.length > 0 && (
                                <div className={`${settings.theme === 'dark' ? 'bg-gray-800 border-gray-700' : 'bg-gray-50 border-gray-200'} rounded-xl border p-6 mt-8`}>
                                    <h2 className="text-lg font-bold mb-4">📊 רצפים אחרונים</h2>
                                    <div className="space-y-3 max-h-48 overflow-y-auto">
                                        {logs.slice(-5).reverse().map((log, idx) => (
                                            <div key={idx} className={`${settings.theme === 'dark' ? 'bg-gray-700' : 'bg-white'} rounded-lg p-3 text-sm`}>
                                                <div className="font-semibold text-amber-400">
                                                    {new Date(log.date).toLocaleDateString('he-IL')} - {log.daysReached} ימים
                                                </div>
                                                <div className="text-gray-400 text-xs">{log.reason}</div>
                                                {log.note && <div className="text-gray-500 mt-1 italic">💭 {log.note}</div>}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </main>
                        
                        {/* Reset Streak Modal */}
                        <Modal
                            isOpen={showResetModal}
                            onClose={() => setShowResetModal(false)}
                            title="דיווח על נפילה"
                            theme={settings.theme}
                        >
                            <div className="space-y-4">
                                <p className="text-sm text-gray-400">
                                    כל נפילה היא הזדמנות ללמוד. אנא שתף את מה שקרה כדי שנוכל לעזור.
                                </p>
                                <div>
                                    <label className="block text-sm font-semibold mb-2">
                                        📌 מה היה הטריגר?
                                    </label>
                                    <div className="space-y-2">
                                        {[
                                            'עייפות וקוצר רוח',
                                            'לחץ רגשי',
                                            'שיעמום',
                                            'בדידות',
                                            'רגעי חולשה',
                                            'אחר'
                                        ].map((reason) => (
                                            <label key={reason} className="flex items-center gap-3 p-2 rounded-lg cursor-pointer hover:bg-gray-700">
                                                <input
                                                    type="radio"
                                                    name="reason"
                                                    value={reason}
                                                    checked={resetReason === reason}
                                                    onChange={(e) => setResetReason(e.target.value)}
                                                    className="w-4 h-4"
                                                />
                                                <span>{reason}</span>
                                            </label>
                                        ))}
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-sm font-semibold mb-2">
                                        💭 הערה אישית (אופציונלי)
                                    </label>
                                    <textarea
                                        value={resetNote}
                                        onChange={(e) => setResetNote(e.target.value)}
                                        placeholder="מה יכול לעזור לך בפעם הבאה?"
                                        className={`w-full px-4 py-3 rounded-lg border resize-none ${
                                            settings.theme === 'dark'
                                                ? 'bg-gray-700 border-gray-600'
                                                : 'bg-white border-gray-300'
                                        }`}
                                        rows="3"
                                    />
                                </div>
                                <button
                                    onClick={handleResetStreak}
                                    className="w-full bg-red-600 hover:bg-red-700 text-white p-3 rounded-lg font-semibold smooth-transition"
                                >
                                    איפוס הרצף וקבל חוזקה
                                </button>
                            </div>
                        </Modal>
                        
                        {/* Settings Modal */}
                        <Modal
                            isOpen={showSettingsModal}
                            onClose={() => setShowSettingsModal(false)}
                            title="⚙️ הגדרות"
                            theme={settings.theme}
                        >
                            <div className="space-y-6">
                                <div>
                                    <label className="block text-sm font-semibold mb-2">🎨 ערכת נושא</label>
                                    <div className="flex gap-2">
                                        {['dark', 'light'].map((theme) => (
                                            <button
                                                key={theme}
                                                onClick={() => setSettings({ ...settings, theme })}
                                                className={`flex-1 p-2 rounded-lg font-semibold smooth-transition ${
                                                    settings.theme === theme
                                                        ? 'bg-blue-600 text-white'
                                                        : settings.theme === 'dark'
                                                        ? 'bg-gray-700 text-gray-300'
                                                        : 'bg-gray-100 text-gray-700'
                                                }`}
                                            >
                                                {theme === 'dark' ? '🌙' : '☀️'} {theme === 'dark' ? 'כהה' : 'בהיר'}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                                
                                <div>
                                    <label className="block text-sm font-semibold mb-2">✍️ פרופיל</label>
                                    <div className="space-y-2 text-sm text-gray-400">
                                        <p>שם: <span className="text-white font-semibold">{profile.name}</span></p>
                                        <p>גיל: <span className="text-white font-semibold">{profile.age}</span></p>
                                        <p>מגדר: <span className="text-white font-semibold">{profile.gender}</span></p>
                                        <p>הבטחה: <span className="text-white font-semibold text-xs italic">"{profile.promise}"</span></p>
                                    </div>
                                </div>
                                
                                <div>
                                    <label className="block text-sm font-semibold mb-2">🔏 קוד PIN: {settings.pinCode}</label>
                                </div>
                                
                                {profile.signatureDataUrl && (
                                    <div>
                                        <label className="block text-sm font-semibold mb-2">✍️ החתימה שלך</label>
                                        <img
                                            src={profile.signatureDataUrl}
                                            alt="Signature"
                                            className="w-full h-24 rounded-lg border border-gray-700"
                                        />
                                    </div>
                                )}
                                
                                <button
                                    onClick={() => {
                                        localStorage.clear();
                                        setRegistered(false);
                                    }}
                                    className="w-full bg-red-600 hover:bg-red-700 text-white p-3 rounded-lg font-semibold smooth-transition"
                                >
                                    🔄 התחל מחדש
                                </button>
                            </div>
                        </Modal>
                    </div>
                </EitanContext.Provider>
            );
        };
        
        // ============= Render App =============
        ReactDOM.createRoot(document.getElementById('root')).render(<EitanApp />);
    </script>
</body>
</html>
